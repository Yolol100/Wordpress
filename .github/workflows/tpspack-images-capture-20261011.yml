name: Temporary TPS Pack original image acquisition
on:
  push:
    branches:
      - runtime/tpspack-images-capture-20261011
    paths:
      - .github/workflows/tpspack-images-capture-20261011.yml
permissions:
  contents: write
jobs:
  get-source-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image verifier
        run: python3 -m pip install --quiet pillow
      - name: Download and verify original TPS Pack images
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,os,urllib.parse,urllib.request,time,pathlib
          from PIL import Image, ImageDraw, ImageFont
          base="https://image.jimcdn.com/app/cms/image/transf/none/path/s3984600fb751a347/image/{image}/version/{version}/image.{ext}"
          raw="""19 i5d1c336b27b57c9a 1712678190 jpg
          20 icbb62683e94372a9 1712677679 jpg
          21 i61ad0a70d7a99403 1712678811 jpg
          22 i8e675cb6dd880249 1712678772 jpg
          23 ib4eff073313e086a 1712679109 png
          24 i884b1b592e7731ad 1712679348 jpg
          25 i0a1554316928e585 1712679702 jpg
          26 i6ceb00c3dce8259f 1712683752 jpg
          27 i9bbd9861fbd18c5a 1712684597 jpg
          28 i3930235ae67349dd 1712684637 jpg
          29 ia4408d840baf7b79 1753102605 jpg
          30 ifc8deb739b5aaa3a 1712398476 jpg
          31 i956c8ef179c35ba8 1712441837 jpg
          32 ia6c1bc18ec30e1c0 1717052739 jpg
          33 ib827274a97041497 1754302545 jpg
          34 i3254402c4ace4a48 1754302528 jpg
          35 i1095b2a01676a9fd 1754302518 jpg
          36 i7f519c37cb71f972 1754302507 jpg
          37 i1048284e7e97f8a5 1754302499 png
          38 i80874806f1dd24aa 1754302492 jpg
          39 i6d0cbbeafac69fb9 1754302486 jpg
          40 i6d465b52f8ffbce7 1754302465 jpg
          41 if3a7281e9cbb200b 1754302461 jpg
          42 i252cb3f49e49c56e 1754302609 jpg
          43 iba86c76162ddeb02 1753271700 jpg
          44 ifde7e5675e548246 1753271707 jpg
          45 i657129ad04e3a617 1753271713 jpg
          46 ia7eb128bc378e180 1753271720 jpg
          47 ic782a3b88c37ce39 1753271851 jpg
          48 i2a0ab276dc36f271 1753277144 jpg
          49 ieafb1d37cddb0831 1753277121 jpg
          50 i30497fe21c8fd9cf 1753289775 jpg
          51 i559279704f170f7c 1753289775 jpg
          52 ia1e5c3677983cd6d 1753442019 jpg
          53 i25617c25ef748a0b 1753443558 jpg
          54 i980149e3f9c9863c 1754306000 jpg
          55 ife05e5ba5919a4e4 1754305990 jpg
          56 iaddbdb4fef6e90aa 1754305985 jpg
          57 i63ca5a1f16050038 1754306066 jpg
          58 i0c7b84f563b8d713 1754306191 jpg"""
          entries=[]
          for line in raw.splitlines():
              id_,image,version,ext=line.split()
              product_id=int(id_)
              assert 19 <= product_id <= 58 and len(image)==17 and image.startswith("i") and version.isdigit() and ext in ("jpg","png")
              url=base.format(image=image,version=version,ext=ext)
              entries.append((product_id,ext,url))
          assert len(entries)==40 and len(set(e[0] for e in entries))==40
          dest=pathlib.Path("assets/inbox/tpspack")
          dest.mkdir(parents=True,exist_ok=True)
          records=[];images=[]
          for product_id,ext,url in entries:
              data=None;problem=None
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; TPSPackMediaMigration/1.0)","Accept":"image/avif,image/webp,image/png,image/jpeg,*/*"})
                      with urllib.request.urlopen(request,timeout=25) as response:
                          actual=urllib.parse.urlsplit(response.geturl())
                          if actual.scheme!="https" or actual.hostname!="image.jimcdn.com":
                              raise ValueError("image was redirected outside trusted image host")
                          ct=response.headers.get("Content-Type","")
                          if not ct.startswith("image/"):
                              raise ValueError("invalid content type "+ct)
                          data=response.read(6000001)
                          if not (1024<len(data)<=6000000):
                              raise ValueError("invalid image byte count "+str(len(data)))
                      if ext=="jpg" and list(data[:3])!=[255,216,255]:
                          raise ValueError("not a JPEG image")
                      if ext=="png" and list(data[:8])!=[137,80,78,71,13,10,26,10]:
                          raise ValueError("not a PNG image")
                      with Image.open(io.BytesIO(data)) as im:
                          im.verify()
                      with Image.open(io.BytesIO(data)) as im:
                          w,h=im.size
                          if min(w,h)<90 or max(w,h)>12000:
                              raise ValueError("unexpected source image dimensions")
                          copied=im.convert("RGB")
                      path=dest/("product-"+str(product_id)+"."+ext)
                      path.write_bytes(data)
                      images.append((product_id,copied))
                      records.append({"id":product_id,"path":str(path),"source":url,"bytes":len(data),"dimensions":[w,h],"sha256":hashlib.sha256(data).hexdigest()})
                      print("OK",product_id,ext,w,h,len(data),flush=True)
                      break
                  except Exception as error:
                      problem=str(error)
                      print("RETRY",product_id,attempt+1,problem,flush=True)
                      time.sleep(attempt+1)
              else:
                  records.append({"id":product_id,"source":url,"error":problem})
                  print("FAILED",product_id,problem,flush=True)
          audit=pathlib.Path("audits/tpspack-media-20261011")
          audit.mkdir(parents=True,exist_ok=True)
          (audit/"manifest.json").write_text(json.dumps(records,indent=2))
          for batch in range(4):
              subset=images[batch*10:batch*10+10]
              sheet=Image.new("RGB",(1600,920),"white")
              draw=ImageDraw.Draw(sheet)
              for n,(product_id,img) in enumerate(subset):
                  cellx=(n%5)*320
                  celly=(n//5)*460
                  thumb=img.copy();thumb.thumbnail((285,390))
                  x=cellx+(320-thumb.width)//2
                  y=celly+45+(400-thumb.height)//2
                  sheet.paste(thumb,(x,y))
                  draw.text((cellx+10,celly+10),str(product_id),fill="black")
              sheet.save(audit/("contact-"+str(batch+1)+".jpg"),quality=82,optimize=True)
          errors=[r for r in records if "error" in r]
          print("SUMMARY",len(images),"images",len(errors),"errors","bytes",sum(x.get("bytes",0) for x in records),flush=True)
          if errors:raise SystemExit("Failed to acquire all images; manifest contains diagnostics")
          PY
      - name: Commit source image binaries on isolated runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/inbox/tpspack audits/tpspack-media-20261011
          git commit -m "Capture and verify 40 original TPS Pack source images"
          git push origin "HEAD:runtime/tpspack-images-capture-20261011"
