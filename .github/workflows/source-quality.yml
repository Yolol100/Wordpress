name: Source syntax and CSV preflight tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all tracked PHP source
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 php -l

  static:
    name: Python regression, JSON and browser bundle syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile scripts/preflight_media_metadata_csv.py
      - name: Metadata preflight regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Translation JSON syntax
        run: python3 -m json.tool languages/modern-image-manager-nl_NL-modern-image-manager-admin.json > /dev/null
      - name: Browser bundle syntax
        run: node --check build/admin/index.js
