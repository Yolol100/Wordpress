name: Source syntax and CSV preflight tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all tracked PHP source
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 php -l

  static:
    name: Python regression, JSON and browser bundle syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python syntax
        run: python3 -m py_compile scripts/preflight_media_metadata_csv.py
      - name: Metadata preflight regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Translation JSON syntax
        run: python3 -m json.tool languages/modern-image-manager-nl_NL-modern-image-manager-admin.json > /dev/null
      - name: Browser bundle syntax
        run: node --check build/admin/index.js

  wordpress:
    name: WordPress runtime, REST and permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli
      - name: Install verified WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/wp-cli.phar \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  /tmp/wp-cli.phar' | sha256sum --check --strict
      - name: Activate plugin in isolated WordPress
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/modern-image-manager-runtime"
          plugin_dir="$runtime/wp-content/plugins/modern-image-manager"
          php /tmp/wp-cli.phar core download --path="$runtime" --version=6.8 --locale=en_US
          php /tmp/wp-cli.phar config create --path="$runtime" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          php /tmp/wp-cli.phar config set WP_DEBUG true --raw --path="$runtime"
          php /tmp/wp-cli.phar config set WP_DEBUG_LOG true --raw --path="$runtime"
          php /tmp/wp-cli.phar core install --path="$runtime" --url=http://mim.test --title='MIM CI' --admin_user=admin --admin_password='ci-isolated-password' --admin_email=ci@example.invalid --skip-email
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.git/' "$GITHUB_WORKSPACE/" "$plugin_dir/"
          php /tmp/wp-cli.phar plugin activate modern-image-manager --path="$runtime"
          php /tmp/wp-cli.phar eval-file "$plugin_dir/tests/runtime-smoke.php" --path="$runtime"
          if test -f "$runtime/wp-content/debug.log"; then
            if grep -Eqi 'PHP (Fatal error|Parse error|Warning|Deprecated|Notice)' "$runtime/wp-content/debug.log"; then
              cat "$runtime/wp-content/debug.log"
              exit 1
            fi
          fi
